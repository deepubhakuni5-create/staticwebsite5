apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-website5
spec:
  replicas: 2
  selector:
    matchLabels:
      app: static-website5
  template:
    metadata:
      labels:
        app: static-website5
    spec:
      containers:
        - name: static-website5
          image: deepu09567/static-website5:latest
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: static-website5-service
spec:
  type: NodePort
  selector:
    app: static-website5
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30077

